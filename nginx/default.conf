upstream lyrics_sync_upstream {
    server lyric-sync:8000;
}

upstream tarpit_upstream {
    server tarpit:8080;
}

map $query_string $route_to_tarpit_query {
    default 0;
    ~*(^|&)XDEBUG_SESSION_START= 1;
    ~*(^|&)format=json($|&) 1;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location @tarpit {
        proxy_pass http://tarpit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* "^/(_next(?:/|$)|api(?:/|$)|app(?:/|$)|actuator(?:/|$)|geoserver(?:/|$)|manage(?:/|$)|admin(?:/|$)|index\\.html(?:/|$)?|login(?:[./]|$)|remote/login(?:/|$)|doc/index\\.html(?:/|$)?|webpages/login\\.html(?:/|$)?|cgi-bin/login\\.cgi(?:/|$)?|web(?:/|$)|SDK/webLanguage(?:/|$)?|metrics(?:/|$)|json(?:/|$)|sse(?:/|$)|mcp(?:-sse)?(?:/|$)|models/(?:edit|apply)(?:/|$)|chat/completions(?:/|$)|%2BCSCOE%2B/logon\\.html(?:/|$)?)" {
        return 418;
    }

    location / {
        if ($route_to_tarpit_query) {
            return 418;
        }

        proxy_pass http://lyrics_sync_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    error_page 418 = @tarpit;
}