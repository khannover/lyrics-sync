upstream lyrics_sync_upstream {
    server lyric-sync:8000;
}

upstream tarpit_upstream {
    server tarpit:8080;
}

map $query_string $route_to_tarpit_query {
    default 0;
    ~*(^|&)XDEBUG_SESSION_START= 1;
    ~*(^|&)format=json($|&) 1;
}

map $http_user_agent $route_to_tarpit_ua {
    default 0;
    ~*Palo\s+Alto\s+Networks 1;
    ~*visionheight\.com/scan 1;
    ~*MGLNDD 1;
    ~*^Mozilla/5\.0$ 1;
}

map "$http_user_agent:$request_method" $route_to_tarpit_empty_ua {
    default 0;
    ":GET" 1;
    ":HEAD" 1;
    ":OPTIONS" 1;
    "-:GET" 1;
    "-:HEAD" 1;
    "-:OPTIONS" 1;
}

map $server_protocol $route_to_tarpit_proto {
    default 0;
    HTTP/1.0 1;
}

map $request_method $route_to_tarpit_method {
    default 1;
    GET 0;
    POST 0;
    HEAD 0;
    PUT 0;
    DELETE 0;
    OPTIONS 0;
    PATCH 0;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    if ($route_to_tarpit_method) {
        set $tarpit_reason "method";
        return 418;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location @tarpit {
        proxy_pass http://tarpit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Tarpit-Reason $tarpit_reason;
    }

    location ~* "^/(_next(?:/|$)|api(?:/|$)|app(?:/|$)|actuator(?:/|$)|geoserver(?:/|$)|manage(?:/|$)|admin(?:/|$)|index\\.html(?:/|$)?|login(?:[./]|$)|remote/login(?:/|$)|doc/index\\.html(?:/|$)?|webpages/login\\.html(?:/|$)?|cgi-bin/login\\.cgi(?:/|$)?|web(?:/|$)|SDK/webLanguage(?:/|$)?|metrics(?:/|$)|json(?:/|$)|sse(?:/|$)|mcp(?:-sse)?(?:/|$)|models/(?:edit|apply)(?:/|$)|chat/completions(?:/|$)|%2BCSCOE%2B/logon\\.html(?:/|$)?|\\.well-known(?:/|$)|security\\.txt(?:/|$)?|sitemap\\.xml(?:/|$)?|\\.env(?:/|$)?)" {
        set $tarpit_reason "path";
        return 418;
    }

    location / {
        if ($route_to_tarpit_query) {
            set $tarpit_reason "query";
            return 418;
        }
        if ($route_to_tarpit_ua) {
            set $tarpit_reason "user-agent";
            return 418;
        }
        if ($route_to_tarpit_empty_ua) {
            set $tarpit_reason "empty-ua";
            return 418;
        }
        if ($route_to_tarpit_proto) {
            set $tarpit_reason "http10";
            return 418;
        }

        proxy_pass http://lyrics_sync_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    error_page 418 = @tarpit;
}