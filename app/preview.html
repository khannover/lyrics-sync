<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KAI | Auto-Sync Viewer</title>
    <style>
        :root { --orange: #ff8c00; --dark: #0a0a0a; --dim: rgba(255, 255, 255, 0.2); }
        body { background: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; height: 100vh; overflow: hidden; }
        .dashboard { background: #151515; padding: 20px; width: 90%; max-width: 800px; border-bottom: 2px solid var(--orange); display: flex; gap: 20px; margin-top: 10px; z-index: 100; }
        .control-group { display: flex; flex-direction: column; flex: 1; }
        label { color: var(--orange); font-size: 0.7rem; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }
        input { background: #222; color: #888; border: 1px solid #333; padding: 5px; border-radius: 4px; }
        #lyrics-window { flex-grow: 1; width: 100%; overflow-y: hidden; text-align: center; mask-image: linear-gradient(transparent, black 35%, black 65%, transparent); -webkit-mask-image: linear-gradient(transparent, black 35%, black 65%, transparent); }
        #lyrics-content { padding: 20vh 0; transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1); }
        .lyric-line { padding: 20px; font-size: 1.8rem; color: var(--dim); filter: blur(3px); transition: all 0.5s ease; transform: scale(0.85); }
        .active { color: var(--orange) !important; filter: blur(0px) !important; transform: scale(1.35) !important; text-shadow: 0 0 15px var(--orange), 0 0 30px rgba(255, 140, 0, 0.4); font-weight: bold; }
        .player-container { width: 100%; background: #111; padding: 10px 0; display: flex; justify-content: center; }
        audio { width: 80%; max-width: 800px; filter: invert(100%) hue-rotate(180deg) brightness(1.5); }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="control-group">
            <label>1. Select Audio (.mp3)</label>
            <input type="file" id="audio-file" accept="audio/mp3">
        </div>
        <div class="control-group">
            <label>2. Select Sync Data (.lrc / .txt)</label>
            <input type="file" id="lrc-file" accept=".lrc,.txt">
        </div>
    </div>

    <div id="lyrics-window">
        <div id="lyrics-content">
            <div class="lyric-line active">Waiting for files...</div>
            <div class="lyric-line">Select your Equilibrium MP3 and its LRC sync file.</div>
        </div>
    </div>

    <div class="player-container"><audio id="audio-player" controls></audio></div>

    <script>
        const player = document.getElementById('audio-player');
        const audioInput = document.getElementById('audio-file');
        const lrcInput = document.getElementById('lrc-file');
        const content = document.getElementById('lyrics-content');
        const windowEl = document.getElementById('lyrics-window');

        let syncMap = [];

        // Load Audio
        audioInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) player.src = URL.createObjectURL(file);
        };

        // Load and Parse Sidecar LRC File
        lrcInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const raw = event.target.result;
                syncMap = [];
                content.innerHTML = '';

                // Parser for [mm:ss.xx] format
                raw.split('\n').forEach(line => {
                    const match = line.match(/\[(\d+):(\d+\.\d+)\](.*)/);
                    if (match) {
                        const ms = (parseInt(match[1]) * 60 + parseFloat(match[2])) * 1000;
                        syncMap.push({ time: ms, text: match[3].trim() });
                    }
                });

                syncMap.forEach((item, i) => {
                    const div = document.createElement('div');
                    div.className = 'lyric-line';
                    div.id = `line-${i}`;
                    div.innerText = item.text;
                    content.appendChild(div);
                });
            };
            reader.readAsText(file);
        };

        // Sync Engine
        player.ontimeupdate = () => {
            const now = player.currentTime * 1000;
            syncMap.forEach((line, i) => {
                const next = syncMap[i + 1];
                if (now >= line.time && (!next || now < next.time)) {
                    document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
                    const activeEl = document.getElementById(`line-${i}`);
                    if (activeEl) {
                        activeEl.classList.add('active');
                        const targetScroll = activeEl.offsetTop - (windowEl.offsetHeight / 2);
                        content.style.transform = `translateY(-${targetScroll}px)`;
                    }
                }
            });
        };
    </script>
</body>
</html>
