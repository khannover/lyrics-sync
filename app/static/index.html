<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KAI | Auto-Sync Viewer</title>
    <style>
        :root { --orange: #ff8c00; --dark: #0a0a0a; --dim: rgba(255, 255, 255, 0.2); }
        * { box-sizing: border-box; }
        body { background: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; height: 100vh; overflow: hidden; }

        .dashboard { background: #151515; padding: 20px; width: 90%; max-width: 900px; border-bottom: 2px solid var(--orange); display: flex; flex-wrap: wrap; gap: 15px; margin-top: 10px; z-index: 100; }
        .control-group { display: flex; flex-direction: column; flex: 1; min-width: 200px; }
        label { color: var(--orange); font-size: 0.7rem; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }
        input[type="file"] { background: #222; color: #888; border: 1px solid #333; padding: 5px; border-radius: 4px; }

        .btn-row { display: flex; align-items: flex-end; gap: 10px; }
        button { background: var(--orange); color: var(--dark); border: none; padding: 8px 20px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; }
        button:hover { background: #ffaa33; transform: scale(1.03); }
        button:disabled { background: #555; color: #888; cursor: not-allowed; transform: none; }

        .status-bar { width: 90%; max-width: 900px; padding: 8px 15px; font-size: 0.75rem; color: #888; background: #111; border-bottom: 1px solid #222; min-height: 30px; display: flex; align-items: center; gap: 10px; }
        .status-bar .spinner { width: 14px; height: 14px; border: 2px solid #555; border-top-color: var(--orange); border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        .status-bar.loading .spinner { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .tabs { display: flex; gap: 0; width: 90%; max-width: 900px; }
        .tab { padding: 8px 20px; background: #1a1a1a; color: #666; cursor: pointer; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab.active { color: var(--orange); border-bottom-color: var(--orange); background: #151515; }

        .tab-content { display: none; }
        .tab-content.active { display: flex; flex-wrap: wrap; gap: 15px; width: 100%; }

        #lyrics-window { flex-grow: 1; width: 100%; overflow-y: auto; scroll-behavior: smooth; text-align: center; mask-image: linear-gradient(transparent, black 35%, black 65%, transparent); -webkit-mask-image: linear-gradient(transparent, black 35%, black 65%, transparent); }
        #lyrics-content { padding: 20vh 0; }
        .lyric-line { padding: 20px; font-size: 1.8rem; color: var(--dim); filter: blur(3px); transition: all 0.5s ease; transform: scale(0.85); cursor: pointer; }
        .lyric-line:hover { filter: blur(1px); color: rgba(255,255,255,0.4); }
        .active { color: var(--orange) !important; filter: blur(0px) !important; transform: scale(1.35) !important; text-shadow: 0 0 15px var(--orange), 0 0 30px rgba(255, 140, 0, 0.4); font-weight: bold; }

        .player-container { width: 100%; background: #111; padding: 10px 0; display: flex; justify-content: center; }
        audio { width: 80%; max-width: 800px; filter: invert(100%) hue-rotate(180deg) brightness(1.5); }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Tab switcher -->
        <div class="tabs" style="width: 100%; margin-bottom: 5px;">
            <div class="tab active" data-tab="auto">⚡ Auto-Sync (API)</div>
            <div class="tab" data-tab="manual">📂 Manual (Local Files)</div>
        </div>

        <!-- Tab 1: Auto-sync via API -->
        <div class="tab-content active" id="tab-auto">
            <div class="control-group">
                <label>1. Select Audio (.mp3)</label>
                <input type="file" id="auto-audio" accept=".mp3,audio/mpeg">
            </div>
            <div class="control-group">
                <label>2. Select Lyrics (.txt)</label>
                <input type="file" id="auto-lyrics" accept=".txt,text/plain">
            </div>
            <div class="btn-row">
                <button id="btn-sync" disabled>🔄 Sync Lyrics</button>
            </div>
        </div>

        <!-- Tab 2: Manual local files -->
        <div class="tab-content" id="tab-manual">
            <div class="control-group">
                <label>1. Select Audio (.mp3)</label>
                <input type="file" id="manual-audio" accept=".mp3,audio/mpeg">
            </div>
            <div class="control-group">
                <label>2. Select Sync Data (.lrc)</label>
                <input type="file" id="manual-lrc" accept=".lrc,.txt">
            </div>
        </div>
    </div>

    <div class="status-bar" id="status-bar">
        <div class="spinner"></div>
        <span id="status-text">Ready — select files and click Sync.</span>
    </div>

    <div id="lyrics-window">
        <div id="lyrics-content">
            <div class="lyric-line active">Waiting for files...</div>
            <div class="lyric-line">Upload an MP3 and lyrics to auto-sync, or load local files.</div>
        </div>
    </div>
    <div class="player-container"><audio id="audio-player" controls></audio></div>

    <script>
        // ─── Elements ───
        const player    = document.getElementById('audio-player');
        const content   = document.getElementById('lyrics-content');
        const windowEl  = document.getElementById('lyrics-window');
        const statusBar = document.getElementById('status-bar');
        const statusTxt = document.getElementById('status-text');
        const btnSync   = document.getElementById('btn-sync');

        const autoAudio   = document.getElementById('auto-audio');
        const autoLyrics  = document.getElementById('auto-lyrics');
        const manualAudio = document.getElementById('manual-audio');
        const manualLrc   = document.getElementById('manual-lrc');

        let syncMap = [];

        // ─── Tab switching ───
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
            });
        });

        // ─── Status helpers ───
        function setStatus(msg, loading = false) {
            statusTxt.textContent = msg;
            statusBar.classList.toggle('loading', loading);
        }

        // ─── Enable sync button when both files selected ───
        function checkAutoReady() {
            btnSync.disabled = !(autoAudio.files.length && autoLyrics.files.length);
        }
        autoAudio.addEventListener('change', checkAutoReady);
        autoLyrics.addEventListener('change', checkAutoReady);

        // ─── AUTO-SYNC: Call the API ───
        btnSync.addEventListener('click', async () => {
            const mp3File = autoAudio.files[0];
            const lyrFile = autoLyrics.files[0];
            if (!mp3File || !lyrFile) return;

            btnSync.disabled = true;
            setStatus('Uploading and syncing… this may take a minute.', true);

            try {
                const form = new FormData();
                form.append('mp3', mp3File);
                form.append('lyrics', lyrFile);

                const resp = await fetch('/sync', { method: 'POST', body: form });

                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({ detail: resp.statusText }));
                    throw new Error(err.detail || 'Sync failed');
                }

                setStatus('Processing response…', true);

                // Response is a ZIP containing _synced.mp3 and _synced.lrc
                const blob = await resp.blob();
                const zip  = await loadZip(blob);

                // Find the files in the ZIP
                let mp3Blob = null, lrcText = null;
                for (const [name, data] of zip) {
                    if (name.endsWith('.mp3')) mp3Blob = data;
                    if (name.endsWith('.lrc')) lrcText = await data.text();
                }

                if (!mp3Blob || !lrcText) throw new Error('ZIP missing expected files');

                // Load audio
                player.src = URL.createObjectURL(mp3Blob);

                // Parse LRC and display
                parseLrc(lrcText);

                setStatus(`✅ Synced! ${syncMap.length} lines aligned. Press play.`, false);

                // Offer download
                offerDownload(blob, mp3File.name.replace('.mp3', '_synced.zip'));

            } catch (err) {
                setStatus(`❌ Error: ${err.message}`, false);
                console.error(err);
            } finally {
                btnSync.disabled = false;
                checkAutoReady();
            }
        });

        // ─── MANUAL: Load local files ───
        manualAudio.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                player.src = URL.createObjectURL(file);
                setStatus('Audio loaded. Now load an LRC file.', false);
            }
        });

        manualLrc.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                parseLrc(ev.target.result);
                setStatus(`✅ LRC loaded: ${syncMap.length} lines. Press play.`, false);
            };
            reader.readAsText(file);
        });

        // ─── LRC Parser ───
        function parseLrc(raw) {
            syncMap = [];
            content.innerHTML = '';
            raw.split('\n').forEach(line => {
                const match = line.match(/\[(\d+):(\d+\.?\d*)\](.*)/);
                if (match) {
                    const ms = (parseInt(match[1]) * 60 + parseFloat(match[2])) * 1000;
                    const text = match[3].trim();
                    if (text) syncMap.push({ time: ms, text });
                }
            });
            syncMap.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'lyric-line';
                div.id = `line-${i}`;
                div.innerText = item.text;
                // Click to seek
                div.addEventListener('click', () => {
                    player.currentTime = item.time / 1000;
                    if (player.paused) player.play();
                });
                content.appendChild(div);
            });
        }

        // ─── Sync Engine ───
        let lastActive = -1;
        player.addEventListener('timeupdate', () => {
            const now = player.currentTime * 1000;
            let activeIdx = -1;

            for (let i = syncMap.length - 1; i >= 0; i--) {
                if (now >= syncMap[i].time) { activeIdx = i; break; }
            }

            if (activeIdx !== lastActive) {
                lastActive = activeIdx;
                document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
                if (activeIdx >= 0) {
                    const activeEl = document.getElementById(`line-${activeIdx}`);
                    if (activeEl) {
                        activeEl.classList.add('active');
                        const targetScroll = activeEl.offsetTop - (windowEl.offsetHeight / 2);
                        windowEl.scrollTo({ top: Math.max(0, targetScroll), behavior: 'smooth' });
                    }
                }
            }
        });

        // ─── Minimal ZIP reader (no external lib needed) ───
        async function loadZip(blob) {
            const buf  = await blob.arrayBuffer();
            const view = new DataView(buf);
            const entries = [];
            let offset = 0;

            while (offset < buf.byteLength - 4) {
                const sig = view.getUint32(offset, true);
                if (sig !== 0x04034b50) break; // local file header

                const compMethod  = view.getUint16(offset + 8, true);
                const compSize    = view.getUint32(offset + 18, true);
                const uncompSize  = view.getUint32(offset + 22, true);
                const nameLen     = view.getUint16(offset + 26, true);
                const extraLen    = view.getUint16(offset + 28, true);
                const nameBytes   = new Uint8Array(buf, offset + 30, nameLen);
                const fileName    = new TextDecoder().decode(nameBytes);
                const dataStart   = offset + 30 + nameLen + extraLen;
                const fileData    = buf.slice(dataStart, dataStart + compSize);

                if (compMethod === 0) {
                    // Stored (no compression)
                    entries.push([fileName, new Blob([fileData])]);
                } else if (compMethod === 8) {
                    // Deflated — use DecompressionStream
                    const ds = new DecompressionStream('deflate-raw');
                    const writer = ds.writable.getWriter();
                    writer.write(new Uint8Array(fileData));
                    writer.close();
                    const decompressed = await new Response(ds.readable).blob();
                    entries.push([fileName, decompressed]);
                } else {
                    console.warn(`Unsupported compression method ${compMethod} for ${fileName}`);
                }

                offset = dataStart + compSize;
            }
            return entries;
        }

        // ─── Offer download ───
        function offerDownload(blob, fileName) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(a.href);
        }
    </script>
</body>
</html>
