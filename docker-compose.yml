version: "3.9"

services:
  lyric-sync:
    build: .
    ports:
      - "8005:8000"
    volumes:
      - model-cache:/app/models
      - /tmp/lyric-sync:/tmp/lyric-sync
    environment:
      - MODEL_SIZE=base
      - SYNC_RATE_LIMIT=
    restart: unless-stopped

volumes:
  model-cache: