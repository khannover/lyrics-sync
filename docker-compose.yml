services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - lyric-sync
      - tarpit
    ports:
      - "8005:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  lyric-sync:
    build:
      context: .
      args:
        MODEL_SIZE: medium
    expose:
      - "8000"
    volumes:
      - model-cache:/app/models
      - lyric-sync-work:/tmp/lyric-sync
    environment:
      - MODEL_SIZE=medium
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_CPU_THREADS=4
      - MAX_CONCURRENT_JOBS=1
      - SYNC_RATE_LIMIT=60/hour
    restart: unless-stopped

  tarpit:
    build:
      context: .
      dockerfile: tarpit/Dockerfile
    expose:
      - "8080"
    environment:
      - TARPIT_DELAY_SECONDS=20
      - TARPIT_STATUS_CODE=404
    restart: unless-stopped

volumes:
  model-cache:
  lyric-sync-work:
