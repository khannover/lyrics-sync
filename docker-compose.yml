x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - lyric-sync
      - tarpit
    ports:
      - "8005:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    logging: *default-logging

  lyric-sync:
    build:
      context: .
      args:
        MODEL_SIZE: small
    expose:
      - "8000"
    volumes:
      - ./app:/app/app
      - model-cache:/app/models
      - lyric-sync-work:/tmp/lyric-sync
    environment:
      - MODEL_SIZE=small
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_CPU_THREADS=4
      - ENABLE_VOCAL_SEPARATION=true
      - MAX_CONCURRENT_JOBS=1
      - SYNC_RATE_LIMIT=60/hour
      - SYNC_JOBS_RATE_LIMIT=1000/hour
      - AUDIO_ANALYZE_RATE_LIMIT=50000/hour
      - LYRIC_SYNC_CALLBACK_SECRET=${LYRIC_SYNC_CALLBACK_SECRET:-}
      - LYRIC_SYNC_CALLBACK_URL_OVERRIDE=${LYRIC_SYNC_CALLBACK_URL_OVERRIDE:-}
      - LYRIC_SYNC_CALLBACK_RETRIES=5
    restart: unless-stopped
    logging: *default-logging
    networks:
      - default
      - shared_net

  tarpit:
    build:
      context: .
      dockerfile: tarpit/Dockerfile
    expose:
      - "8080"
    volumes:
      - tarpit-data:/data
    environment:
      - TARPIT_DELAY_SECONDS=20
      - TARPIT_STATUS_CODE=404
      - TARPIT_LOG_PATH=/data/tarpit-events.jsonl
      - LYRIC_SYNC_CALLBACK_SECRET=${LYRIC_SYNC_CALLBACK_SECRET:-}
    restart: unless-stopped
    logging: *default-logging

volumes:
  model-cache:
  lyric-sync-work:
  tarpit-data:

networks:
  default:
  shared_net:
    name: bancamp-net
    external: true
