services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - lyric-sync
      - tarpit
    ports:
      - "8005:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  lyric-sync:
    build: .
    expose:
      - "8000"
    volumes:
      - model-cache:/app/models
      - /tmp/lyric-sync:/tmp/lyric-sync
    environment:
      - MODEL_SIZE=base
      - SYNC_RATE_LIMIT=60/hour
    restart: unless-stopped

  tarpit:
    build:
      context: .
      dockerfile: tarpit/Dockerfile
    expose:
      - "8080"
    environment:
      - TARPIT_DELAY_SECONDS=20
      - TARPIT_STATUS_CODE=404
    restart: unless-stopped

volumes:
  model-cache: